services:
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: planos_diretores_postgis
    environment:
      POSTGRES_DB: planos_diretores
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planos_diretores_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planos_diretores"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: planos_diretores_api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-planos_diretores_dev}@postgis:5432/planos_diretores
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  webgis:
    image: node:22-alpine
    container_name: planos_diretores_webgis
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./apps/webgis:/app
    depends_on:
      - backend

volumes:
  pgdata:
